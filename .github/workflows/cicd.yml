name: CI/CD

# The gate for hanzo.codes, on the native runners (git.hanzo.ai → git-runner).
# The ~7-line caller shape: triggers plus the import. All real config lives in
# the repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# `.hanzo/workflows`, not `.github/workflows`. The reusable exists at
# hanzoai/ci/.hanzo/workflows/build.yml on both hosts and a caller naming the
# `.github` path silently resolves nothing. The forge also collects workflows
# from the FIRST of WORKFLOW_DIRS present in the pushed commit, so once this
# directory exists a `.github/workflows` beside it would be dark config.
#
# This repo lived on GitHub while it published a Cloudflare Worker, because the
# only copy of that credential was a GitHub org secret. On our own plane there
# is no Cloudflare credential, so that reason is gone and the build belongs here
# with everything else — which also ends the "every run is workflow_dispatch"
# state this repo was stuck in, GitHub having flagged the pushing identity.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
